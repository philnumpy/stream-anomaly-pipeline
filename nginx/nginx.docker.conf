# Load balancer for the Docker Compose stack.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    access_log off;

    # Docker's built-in DNS returns one address per `api` replica. Resolving
    # through a variable makes Nginx look the name up again every 5 seconds,
    # so replicas that are added, removed or restarted are picked up.
    resolver 127.0.0.11 valid=5s;

    server {
        listen 8080;

        location / {
            set $api http://api:8000;
            proxy_pass $api;
            proxy_http_version 1.1;
            proxy_set_header X-Client-Id $http_x_client_id;

            # Retrying a POST on another replica is safe: ingestion is idempotent.
            proxy_next_upstream error timeout non_idempotent;
            proxy_connect_timeout 1s;

            add_header X-Upstream $upstream_addr always;
        }
    }
}
