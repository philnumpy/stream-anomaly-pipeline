# Load balancer for running the stack as plain processes on one machine
# (scripts/stack.py). The Docker version is nginx/nginx.docker.conf.

worker_processes 1;
error_log logs/error.log warn;
pid       logs/nginx.pid;

events {
    worker_connections 1024;
}

http {
    access_log off;

    # Round robin across the replicas (the default). A replica that fails a
    # request is taken out of rotation for 5 seconds, then tried again.
    upstream ingest_api {
        server 127.0.0.1:8001 max_fails=1 fail_timeout=5s;
        server 127.0.0.1:8002 max_fails=1 fail_timeout=5s;
        server 127.0.0.1:8003 max_fails=1 fail_timeout=5s;
        keepalive 32;
    }

    server {
        listen 8080;

        location / {
            proxy_pass http://ingest_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header X-Client-Id $http_x_client_id;

            # If a replica is down, send the same request to the next one.
            # Retrying a POST is safe here because ingestion is idempotent.
            proxy_next_upstream error timeout non_idempotent;
            proxy_connect_timeout 1s;

            add_header X-Upstream $upstream_addr always;
        }
    }
}
